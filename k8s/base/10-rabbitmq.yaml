# RabbitMQ com a topologia do contrato v1.0 carregada no boot.
# As filas vem do ConfigMap, nao do painel — mesma regra do compose.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: oficina
data:
  rabbitmq.conf: |
    load_definitions = /etc/rabbitmq/definitions.json
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: oficina
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: oficina
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.12-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
          volumeMounts:
            - name: config
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
            - name: definitions
              mountPath: /etc/rabbitmq/definitions.json
              subPath: definitions.json
            - name: data
              mountPath: /var/lib/rabbitmq
          # O load_definitions do rabbitmq.conf importa o definitions.json, que so
          # tem o guest - e com definicoes no boot o RabbitMQ NAO cria o
          # RABBITMQ_DEFAULT_USER. Como o guest so aceita conexao local, todo
          # servico tomava ACCESS_REFUSED. O hook garante o usuario do Secret a
          # cada subida; precisa ser a cada subida porque /var/lib/rabbitmq e
          # emptyDir e some quando o pod reinicia. Visto no deploy de 15/11.
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  # O postStart roda logo que o container nasce: o no Erlang pode
                  # nem ter subido ("not running at all") ou ainda estar
                  # importando as definicoes. Por isso a sequencia inteira se
                  # repete ate dar certo (~5 min no maximo), com a saida em
                  # /var/lib/rabbitmq/poststart.log, que sobrevive a um restart
                  # do container dentro do mesmo pod. Antes de qualquer
                  # rabbitmqctl, espera o SERVIDOR criar o .erlang.cookie: se o
                  # CLI chega primeiro num volume vazio, ele cria o cookie como
                  # root e o servidor encerra (exit 0) no primeiro boot.
                  - >-
                    U="$RABBITMQ_DEFAULT_USER"; P="$RABBITMQ_DEFAULT_PASS"; L=/var/lib/rabbitmq/poststart.log; i=0;
                    until [ -s /var/lib/rabbitmq/.erlang.cookie ]; do i=$((i+1)); [ "$i" -ge 60 ] && exit 1; sleep 2; done; i=0;
                    until (rabbitmqctl -q await_startup --timeout 10 &&
                    (rabbitmqctl -q add_user "$U" "$P" || rabbitmqctl -q change_password "$U" "$P") &&
                    rabbitmqctl -q set_permissions -p / "$U" ".*" ".*" ".*" &&
                    rabbitmqctl -q set_user_tags "$U" administrator) >>"$L" 2>&1;
                    do i=$((i+1)); [ "$i" -ge 30 ] && exit 1; sleep 10; done; echo "usuario ok" >>"$L"
          # timeoutSeconds 15: o padrao de 1 s nao cabe no rabbitmq-diagnostics
          # num t3.medium, e o kubelet matava o broker em loop.
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 15
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: config
          configMap:
            name: rabbitmq-config
        - name: definitions
          configMap:
            name: rabbitmq-definitions
        - name: data
          emptyDir: {}
