# Postgres do Billing Service — orcamento e pagamento. Banco por servico (ADR-0007): nenhum outro servico
# tem credencial para este banco, e nenhuma consulta atravessa a fronteira.
apiVersion: v1
kind: Service
metadata:
  name: billing-postgres
  namespace: oficina
  labels:
    app.kubernetes.io/name: billing-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: oficina-fase4
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: billing-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: billing-postgres
  namespace: oficina
  labels:
    app.kubernetes.io/name: billing-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: oficina-fase4
spec:
  serviceName: billing-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: oficina-fase4
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: oficina_billing
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: billing-postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-postgres-credentials
                  key: password
          volumeMounts:
            - name: dados
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
