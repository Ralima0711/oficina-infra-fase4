# Workers do Billing: consomem os comandos do orquestrador e publicam os eventos.
#
# SAO DOIS, um por fila de comando, e a separacao tem motivo.
#
# O acompanhamento do pagamento faz polling no gateway DENTRO do callback do
# consumidor. Com os padroes (poll_interval_seconds 30, poll_max_attempts 20) o
# pior caso sao dez minutos segurando a mensagem. O prefetch e 1, entao, num
# processo so, os dois basic_consume compartilham o canal e um pagamento lento
# segura a fila de gerar-orcamento atras dele por todo esse tempo.
#
# Isso nao trava a saga: o CobrarPagamento::consultar() desiste depois do teto de
# tentativas, marca o pagamento como recusado com motivo timeout e o evento sai.
# O problema e head-of-line blocking — a fila de orcamento espera por uma coisa
# que nao tem nada a ver com ela. Em producao e capacidade; na demo parece
# travamento.
#
# Dois Deployments resolvem: cada um roda `fila:consumir` com as SUAS filas.
#
# Cada worker leva a fila de ida E a de compensacao do mesmo assunto:
# gerar+anular orcamento num, cobrar+estornar pagamento no outro. Ate 12/11 os
# manifestos tinham so gerar e cobrar — anular-orcamento e estornar-pagamento
# ficavam SEM CONSUMIDOR no cluster, e a compensacao, que e o que a fase cobra,
# simplesmente nao rodava no EKS. No compose rodava, e o comentario de la dizia
# que espelhava estes Deployments.
#
# Compensacao junto com a ida, e nao num terceiro worker, porque as duas tocam
# o mesmo agregado: orcamento num processo, pagamento no outro.
#
# Deployment separado da API tambem e de proposito: quem consome fila nao atende
# HTTP. No mesmo pod, o HPA escalaria consumidor por CPU de requisicao web e o
# processamento da saga ficaria amarrado ao trafego.
#
# Replicas fixas: o consumidor e idempotente (contrato v1.1, Parte 5), entao
# varias instancias lendo a mesma fila e seguro. A concorrencia real e
# replicas x prefetch, ou seja 2 orcamentos e 3 cobrancas ao mesmo tempo.
# Escalar por tamanho de fila exigiria KEDA, que esta fora do escopo da fase.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service-worker-orcamento
  namespace: oficina
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: oficina-fase4
    oficina.fila: billing.gerar-orcamento
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-service
      app.kubernetes.io/component: worker
      oficina.fila: billing.gerar-orcamento
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-service
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: oficina-fase4
        oficina.fila: billing.gerar-orcamento
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ralima0711/oficina-billing-service:latest
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "fila:consumir", "--fila=billing.gerar-orcamento", "--fila=billing.anular-orcamento"]
          envFrom:
            - configMapRef:
                name: billing-service-config
          env:
            # Sem APP_KEY o Laravel estoura MissingAppKeyException.
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: billing-app-key
                  key: app-key
            - name: APP_ENV
              value: production
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: observabilidade
                  key: new-relic-license-key
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: billing-postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-postgres-credentials
                  key: password
            - name: MP_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: billing-mercadopago
                  key: access-token
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service-worker-cobranca
  namespace: oficina
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: oficina-fase4
    oficina.fila: billing.cobrar-pagamento
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-service
      app.kubernetes.io/component: worker
      oficina.fila: billing.cobrar-pagamento
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-service
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: oficina-fase4
        oficina.fila: billing.cobrar-pagamento
    spec:
      # Maior que o do orcamento: uma consulta de pagamento em curso pode levar
      # minutos. Cortar no meio nao perde nada — a mensagem nao foi confirmada,
      # o broker reentrega e o consumidor e idempotente — mas esperar evita
      # reprocessar a toa a cada rollout.
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: ralima0711/oficina-billing-service:latest
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "fila:consumir", "--fila=billing.cobrar-pagamento", "--fila=billing.estornar-pagamento"]
          envFrom:
            - configMapRef:
                name: billing-service-config
          env:
            # Sem APP_KEY o Laravel estoura MissingAppKeyException.
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: billing-app-key
                  key: app-key
            - name: APP_ENV
              value: production
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: observabilidade
                  key: new-relic-license-key
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: billing-postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-postgres-credentials
                  key: password
            - name: MP_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: billing-mercadopago
                  key: access-token
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
