# Billing Service — orcamento e pagamento, com integracao ao Mercado Pago.
#
# A imagem abaixo e substituida pelo pipeline (passo `kubectl set image`).
# A tag :latest no repositorio existe so para o manifesto ser aplicavel a mao;
# o deploy de verdade aponta para a tag do commit.
#
# containerPort 8080: conferido com o EXPOSE do Dockerfile (Gustavo, 04/11).
# A probe chama /api/health: no Laravel a rota vive sob o prefixo /api, e
# GET /health responde 404. Conferido no routes/api.php do servico.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: oficina
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: oficina-fase4
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-service
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-service
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: oficina-fase4
    spec:
      containers:
        - name: api
          image: ralima0711/oficina-billing-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: billing-service-config
          env:
            - name: APP_ENV
              value: production
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: observabilidade
                  key: new-relic-license-key
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: billing-postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-postgres-credentials
                  key: password
            - name: MP_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: billing-mercadopago
                  key: access-token
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: oficina
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: oficina-fase4
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
