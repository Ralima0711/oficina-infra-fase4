# Execucao Service — fila de execucao, diagnostico e apontamento de reparo.
#
# A imagem abaixo e substituida pelo pipeline (passo `kubectl set image`).
# A tag :latest no repositorio existe so para o manifesto ser aplicavel a mao;
# o deploy de verdade aponta para a tag do commit.
#
# containerPort 8080: tem que casar com o EXPOSE do Dockerfile do servico.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execucao-service
  namespace: oficina
  labels:
    app.kubernetes.io/name: execucao-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: oficina-fase4
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: execucao-service
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: execucao-service
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: oficina-fase4
    spec:
      # Cria os indices do Mongo antes da API atender, como o compose do servico
      # faz na subida. Idempotente: rodar em todo pod nao custa nada.
      initContainers:
        - name: criar-indices
          image: ralima0711/oficina-execucao-service:latest
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "execucao:criar-indices"]
          envFrom:
            - configMapRef:
                name: execucao-service-config
          env:
            # Sem APP_KEY o Laravel estoura MissingAppKeyException.
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: execucao-app-key
                  key: app-key
            # A URI inteira, com usuario e senha: config/mongodb.php le
            # MONGO_URI e nada mais. MONGO_USERNAME e MONGO_PASSWORD estavam
            # aqui e nao chegavam na conexao.
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: execucao-mongo-credentials
                  key: uri
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
      containers:
        - name: api
          image: ralima0711/oficina-execucao-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: execucao-service-config
          env:
            # Sem APP_KEY o Laravel estoura MissingAppKeyException.
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: execucao-app-key
                  key: app-key
            - name: APP_ENV
              value: production
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: observabilidade
                  key: new-relic-license-key
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: execucao-redis-credentials
                  key: password
            # A URI inteira, com usuario e senha: config/mongodb.php le
            # MONGO_URI e nada mais. MONGO_USERNAME e MONGO_PASSWORD estavam
            # aqui e nao chegavam na conexao.
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: execucao-mongo-credentials
                  key: uri
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: execucao-service
  namespace: oficina
  labels:
    app.kubernetes.io/name: execucao-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: oficina-fase4
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: execucao-service
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
