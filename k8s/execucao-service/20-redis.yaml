# Redis do Execucao Service — fila de execucao com prioridade (ADR-0009).
# appendonly ligado de proposito: fila que some no restart do pod deixa OS
# aprovada e paga sem entrar na oficina, e a saga nao tem como saber.
apiVersion: v1
kind: ConfigMap
metadata:
  name: execucao-redis-config
  namespace: oficina
  labels:
    app.kubernetes.io/name: execucao-redis
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: oficina-fase4
data:
  redis.conf: |
    appendonly yes
    appendfsync everysec
    maxmemory-policy noeviction
---
apiVersion: v1
kind: Service
metadata:
  name: execucao-redis
  namespace: oficina
  labels:
    app.kubernetes.io/name: execucao-redis
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: oficina-fase4
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: execucao-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: execucao-redis
  namespace: oficina
  labels:
    app.kubernetes.io/name: execucao-redis
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: oficina-fase4
spec:
  serviceName: execucao-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: execucao-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: execucao-redis
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: oficina-fase4
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["sh", "-c", "redis-server /etc/redis/redis.conf --requirepass \"$REDIS_PASSWORD\""]
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: execucao-redis-credentials
                  key: password
          volumeMounts:
            - name: config
              mountPath: /etc/redis
            - name: dados
              mountPath: /data
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: execucao-redis-config
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
