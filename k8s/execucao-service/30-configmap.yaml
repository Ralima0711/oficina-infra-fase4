# Configuracao nao sensivel do Execucao Service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: execucao-service-config
  namespace: oficina
  labels:
    app.kubernetes.io/name: execucao-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: oficina-fase4
data:
  # stdout em JSON. Sem isto o Laravel escreve em storage/logs dentro do
  # pod: `kubectl logs` vem vazio e o New Relic nao coleta nada.
  LOG_CHANNEL: "stdout_json"
  REDIS_CLIENT: "predis"
  REDIS_HOST: "execucao-redis"
  REDIS_PORT: "6379"
  # config/mongodb.php le MONGO_URI, nao MONGO_HOST/MONGO_PORT.
  MONGO_URI: "mongodb://execucao-mongo:27017"
  MONGO_DATABASE: "oficina_execucao"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "/"
  # config/rabbitmq.php prefixa tudo com RABBITMQ_.
  RABBITMQ_EXCHANGE_EVENTOS: "oficina.eventos"
  RABBITMQ_FILA_ENVIAR: "execucao.enviar-para-execucao"
  RABBITMQ_FILA_CANCELAR: "execucao.cancelar-execucao"
