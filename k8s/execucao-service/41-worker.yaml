# Worker da Execucao: consome os comandos do orquestrador e publica os eventos.
#
# Deployment separado da API de proposito: quem consome fila nao atende HTTP.
# Se o consumidor rodasse no mesmo pod da API, o HPA escalaria consumidor por
# CPU de requisicao web e o processamento da saga ficaria amarrado ao trafego.
#
# Replicas fixas em 2: o consumidor e idempotente (contrato v1.1, regra 1 da
# Parte 5), entao duas instancias lendo a mesma fila e seguro. Escalar por
# tamanho de fila exigiria KEDA, que esta fora do escopo da fase.
#
# O initContainer cria os indices do Mongo antes de qualquer pod atender. O
# compose do servico ja fazia isso na subida; os manifestos nao faziam, e sem
# o indice unico parcial (osId, tipo) duas requisicoes simultaneas gravam a
# mesma transicao duas vezes. O comando e idempotente, entao rodar em todo pod
# nao custa nada.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execucao-service-worker
  namespace: oficina
  labels:
    app.kubernetes.io/name: execucao-service
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: oficina-fase4
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: execucao-service
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: execucao-service
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: oficina-fase4
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: criar-indices
          image: ralima0711/oficina-execucao-service:latest
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "execucao:criar-indices"]
          envFrom:
            - configMapRef:
                name: execucao-service-config
          env:
            # Sem APP_KEY o Laravel estoura MissingAppKeyException.
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: execucao-app-key
                  key: app-key
            # A URI inteira, com usuario e senha: config/mongodb.php le
            # MONGO_URI e nada mais. MONGO_USERNAME e MONGO_PASSWORD estavam
            # aqui e nao chegavam na conexao.
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: execucao-mongo-credentials
                  key: uri
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
      containers:
        - name: worker
          image: ralima0711/oficina-execucao-service:latest
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "execucao:consumir"]
          envFrom:
            - configMapRef:
                name: execucao-service-config
          env:
            # Sem APP_KEY o Laravel estoura MissingAppKeyException.
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: execucao-app-key
                  key: app-key
            - name: APP_ENV
              value: production
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: observabilidade
                  key: new-relic-license-key
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: execucao-redis-credentials
                  key: password
            # A URI inteira, com usuario e senha: config/mongodb.php le
            # MONGO_URI e nada mais. MONGO_USERNAME e MONGO_PASSWORD estavam
            # aqui e nao chegavam na conexao.
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: execucao-mongo-credentials
                  key: uri
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
