# OS Service — API de atendimento e host do orquestrador da Saga (ADR-0008).
#
# A imagem abaixo e substituida pelo pipeline (passo `kubectl set image`).
# A tag :latest no repositorio existe so para o manifesto ser aplicavel a mao;
# o deploy de verdade aponta para a tag do commit.
#
# containerPort 8080: A CONFIRMAR com o EXPOSE do Dockerfile do servico.
# A probe usa /up, a rota de saude que o Laravel 12 ja traz na raiz, porque
# o servico ainda nao define a sua. Trocar por /api/health quando definir.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-service
  namespace: oficina
  labels:
    app.kubernetes.io/name: os-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: oficina-fase4
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: os-service
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: os-service
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: oficina-fase4
    spec:
      containers:
        - name: api
          image: ralima0711/oficina-os-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: os-service-config
          env:
            # Sem APP_KEY o Laravel estoura MissingAppKeyException.
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: os-app-key
                  key: app-key
            - name: APP_ENV
              value: production
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            # GET /api/ordens-servico/{id}/historico le o read model, entao a
            # API tambem precisa da DSN — nao so o worker que projeta.
            - name: MONGO_DSN
              valueFrom:
                secretKeyRef:
                  name: os-mongo-credentials
                  key: dsn
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: observabilidade
                  key: new-relic-license-key
            # O SDK do OpenTelemetry autentica no New Relic por este header.
            # $(...) so expande variavel declarada ANTES nesta lista.
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: "api-key=$(NEW_RELIC_LICENSE_KEY)"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: os-postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: os-postgres-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: os-service
  namespace: oficina
  labels:
    app.kubernetes.io/name: os-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: oficina-fase4
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: os-service
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
