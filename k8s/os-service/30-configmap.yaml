# Configuracao nao sensivel do OS Service.
# Os nomes de fila vem do contrato-eventos-fase4.md v1.0 — mudar aqui sem
# mudar o contrato (e o definitions.json) quebra a saga em silencio.
apiVersion: v1
kind: ConfigMap
metadata:
  name: os-service-config
  namespace: oficina
  labels:
    app.kubernetes.io/name: os-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: oficina-fase4
data:
  # stdout em JSON. Sem isto o Laravel escreve em storage/logs dentro do
  # pod: `kubectl logs` vem vazio e o New Relic nao coleta nada.
  LOG_CHANNEL: "stdout_json"
  # Traces por OTLP/HTTP direto no New Relic (contrato-observabilidade.md, secao 2).
  # Sem endpoint o SDK vira no-op e nada sai do cluster, mesmo com o codigo pronto.
  # A license key NAO fica aqui: o header vem do Secret `observabilidade`, no workload.
  OTEL_EXPORTER_OTLP_ENDPOINT: "https://otlp.nr-data.net:4318"
  OTEL_SERVICE_NAME: "oficina-os-service"
  DB_CONNECTION: "pgsql"
  DB_HOST: "os-postgres"
  DB_PORT: "5432"
  DB_DATABASE: "oficina_os"
  # Read model (ADR-0009). So o nome do banco fica aqui: a MONGO_DSN leva
  # usuario e senha dentro e vem do Secret os-mongo-credentials, porque
  # config/database.php le MONGO_DSN e so ela.
  MONGO_DATABASE: "os_read_model"
  # config/messaging.php le RABBITMQ_EXCHANGE, nao EXCHANGE_EVENTOS.
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "/"
  RABBITMQ_EXCHANGE: "oficina.eventos"
  # As filas de comando e de evento sao constantes no Orchestrator e no
  # ConsumirEventosSaga. Nao ha env para elas, entao nao se declara aqui:
  # ConfigMap com chave que ninguem le engana quem vier depois.
