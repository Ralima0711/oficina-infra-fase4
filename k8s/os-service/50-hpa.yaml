# HPA herdado do ADR-0002 da Fase 3: min 2 / max 10, CPU 70% ou memoria 80%.
# O minimo de 2 nao e so elasticidade — no OS Service ele e a mitigacao do
# ponto unico de falha registrada no ADR-0008.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: os-service
  namespace: oficina
  labels:
    app.kubernetes.io/name: os-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: oficina-fase4
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: os-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
