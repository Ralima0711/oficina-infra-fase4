# Worker do outbox: publica no RabbitMQ o que o orquestrador gravou.
#
# Processo proprio, separado do consumidor e da API. Sao tres responsabilidades
# e tres modos de falha diferentes: este SO ESCREVE no broker, o os-service-saga
# so le, e a API nao faz nem um nem outro.
#
# Sem este Deployment a saga grava a intencao de publicar dentro da transacao e
# nunca publica: nenhum comando sai e a saga para no primeiro passo.
#
# Replica unica. Duas instancias publicariam a mesma linha do outbox duas vezes
# ate uma marcar — e o consumidor e idempotente, entao nao quebra, mas e ruido
# a toa. O outbox nao e gargalo: ele so le uma tabela e publica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-service-outbox
  namespace: oficina
  labels:
    app.kubernetes.io/name: os-service
    app.kubernetes.io/component: outbox
    app.kubernetes.io/part-of: oficina-fase4
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: os-service
      app.kubernetes.io/component: outbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: os-service
        app.kubernetes.io/component: outbox
        app.kubernetes.io/part-of: oficina-fase4
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: outbox
          image: ralima0711/oficina-os-service:latest
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "saga:publicar-outbox"]
          envFrom:
            - configMapRef:
                name: os-service-config
          env:
            # Sem APP_KEY o Laravel estoura MissingAppKeyException.
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: os-app-key
                  key: app-key
            - name: APP_ENV
              value: production
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: observabilidade
                  key: new-relic-license-key
            # O SDK do OpenTelemetry autentica no New Relic por este header.
            # $(...) so expande variavel declarada ANTES nesta lista.
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: "api-key=$(NEW_RELIC_LICENSE_KEY)"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: os-postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: os-postgres-credentials
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
